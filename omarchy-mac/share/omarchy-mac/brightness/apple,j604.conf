# Automatic brightness for the MacBook Pro 14" M4 (J604), read by omarchy-mac-brightness-auto.
# macOS's own curve for this panel (CoreBrightness status, built-in display): the factory curve
# ALSUserPreference/GoodCurve, Lux1 0 / Lux2 150 against Backlight1 139.44 / Backlight2 223.11 nits,
# MaxNits 600, MinNits 1. Values marked TO-VERIFY are not yet traced.

# The panel's backlight device; its brightness is in nits.
BACKLIGHT=apple-panel-bl
MAX_NITS=600
MIN_NITS=1
# Room illuminance (lux) : display brightness (nits), in a straight line between points and held
# beyond the ends. Above 150 lux the line of macOS's two points is carried on to MaxNits.
CURVE="0:139.44 150:223.11 826:600"   # TO-VERIFY: the curve's shape above 150 lux
# macOS moves the backlight to a new level in 1.94 s.
RAMP_SECONDS=1.94
RAMP_STEPS=20
# Weight of a new sensor reading against the running level.
SMOOTHING=0.25            # TO-VERIFY
# A move smaller than this share of the current level is left alone.
HYSTERESIS_PERCENT=5      # TO-VERIFY: macOS LuxThreshold 78.5
# Seconds between sensor reads (the sensor reports every 0.2 s).
POLL_SECONDS=1
